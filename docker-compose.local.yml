# Local stack. One command (D-03):
#   docker compose -f docker-compose.local.yml up -d --build --wait
# Only web publishes a port, bound to 127.0.0.1. The worker service is added in 01-11.
name: powermon-local

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# No `image:` key on the app services: each one gets its own image. A shared image
# tag once made Compose restart the old migrate container and skip a new migration.
x-app: &app
  build:
    context: .
    target: dev
  env_file: [.env.docker_local]
  logging: *logging

services:
  db:
    image: postgres:18.6-trixie
    command: ["postgres", "-c", "log_min_error_statement=panic", "-c", "log_error_verbosity=terse"]
    env_file: [.env.docker_local]
    volumes:
      # PostgreSQL 18 layout: PGDATA=/var/lib/postgresql/18/docker
      - ./docker_data/local/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  # One-shot: runs on every `up`, before web starts. A failed migration stops the deploy.
  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    command:
      - gunicorn
      - powermon.wsgi
      - --worker-class
      - gthread
      - --workers
      - "2"
      - --threads
      - "4"
      - --bind
      - 0.0.0.0:8000
      - --no-control-socket
      - --worker-tmp-dir
      - /dev/shm
      - --graceful-timeout
      - "20"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
