# Power Monitor (github.com/anzozulia/power_mionitor_v2) behind this host's nginx (README
# section 17). Installed as /etc/nginx/sites-available/powermonitor.anzozulia.com.conf and
# symlinked into sites-enabled/. The app publishes only 127.0.0.1:8091 (docker-compose.vps.yml).
#
# Device keys must never reach a log (OPS-08, INV-23). The access log format has the path
# without its query string. The error log is at crit, because nginx's error lines (e.g. an
# upstream 502 while the app restarts) quote the full request line, ?key= included.
# HSTS comes from Django (max-age=31536000), so this file sets no HSTS header of its own.

log_format powermonitor_noargs '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';

upstream powermonitor_upstream {
    server 127.0.0.1:8091;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name powermonitor.anzozulia.com;

    access_log /var/log/nginx/powermonitor.access.log powermonitor_noargs;
    error_log /var/log/nginx/powermonitor.error.log crit;

    # HTTPS only: there is no plain-HTTP heartbeat path (D-05). The redirect sits in a
    # location, so certbot's exact-match ACME challenge location still wins on renewal.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name powermonitor.anzozulia.com;

    ssl_certificate /etc/letsencrypt/live/powermonitor.anzozulia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/powermonitor.anzozulia.com/privkey.pem;
    # TLS settings copied from /etc/nginx/snippets/ssl-hardening.conf, without its HSTS line.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    access_log /var/log/nginx/powermonitor.access.log powermonitor_noargs;
    error_log /var/log/nginx/powermonitor.error.log crit;

    client_max_body_size 1m;

    location / {
        proxy_pass http://powermonitor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwritten with the socket address, never appended to: the login throttle
        # (SEC-03) takes the rightmost entry, so a client must not be able to supply one.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
